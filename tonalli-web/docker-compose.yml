# Levanta MySQL y la aplicación:   docker compose up -d --build
# Con HTTPS automático (necesita un dominio):   docker compose --profile https up -d --build
# Las contraseñas se leen del archivo .env (copia .env.example a .env y cámbialas).
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tonalliweb
      MYSQL_USER: tonalli
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    volumes:
      - dbdata:/var/lib/mysql
    # El puerto de MySQL solo se abre en la propia máquina, nunca hacia internet.
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/tonalliweb?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: tonalli
      DB_PASSWORD: ${DB_PASSWORD}
      TONALLI_ADMIN_CORREO: ${TONALLI_ADMIN_CORREO:-}
      TONALLI_ADMIN_PASSWORD: ${TONALLI_ADMIN_PASSWORD:-}
      # Datos de ejemplo: apagados salvo que el .env diga TONALLI_DEMO=true. Nunca en producción.
      TONALLI_DEMO: ${TONALLI_DEMO:-false}
      TONALLI_DEMO_PASSWORD: ${TONALLI_DEMO_PASSWORD:-}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      VERIFICACION_OBLIGATORIA: ${VERIFICACION_OBLIGATORIA:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@tonalli.local}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
    # Solo en la propia máquina: el acceso público pasa por el proxy con HTTPS.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Proxy inverso con certificado HTTPS automático (Let's Encrypt). Opcional.
  proxy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Valor por defecto "localhost": Compose interpola todo el archivo aunque este perfil no se use,
      # y exigir la variable impedía levantar el sitio en local. Para HTTPS real, define DOMINIO en .env.
      DOMINIO: ${DOMINIO:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  dbdata:
  caddydata:
