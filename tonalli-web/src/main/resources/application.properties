# ============================================================
# Tonalli Web: configuración base (producción por defecto).
# Todo lo sensible se lee de variables de entorno; aquí no hay secretos.
# ============================================================
spring.application.name=tonalli-web
server.port=${PORT:8080}

# --- Vistas JSP (S5-S7) ---
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.messages.basename=messages

# --- Errores: jamás mostrar trazas ni mensajes internos ---
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# --- Sesión y cookies ---
server.servlet.session.timeout=30m
# Solo cookie: sin esto Tomcat puede poner el id de sesión en la URL (;jsessionid=...), lo que lo filtraría.
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# En producción con HTTPS poner COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# --- Límites contra abuso ---
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB
spring.servlet.multipart.enabled=false

# --- Detrás de un proxy inverso (Caddy): respeta X-Forwarded-*. ---
# Solo es seguro si el puerto 8080 NO es accesible directamente desde internet.
server.forward-headers-strategy=framework

# --- Base de datos (S8-S10) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tonalliweb?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USER:tonalli}
spring.datasource.password=${DB_PASSWORD:}
# update crea y ajusta las tablas solo (cómodo para el curso). En producción real: validate + migraciones (Flyway).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Solo se expone /actuator/health (para el healthcheck de Docker) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# El estado del contenedor no depende del proveedor de correo: si el SMTP falla (o no está configurado),
# Docker no debe dar por caído el sitio ni reiniciarlo. La base de datos sí se sigue comprobando.
management.health.mail.enabled=false

# --- Reglas propias de Tonalli ---
tonalli.verificacion.obligatoria=${VERIFICACION_OBLIGATORIA:true}
tonalli.base-url=${BASE_URL:http://localhost:8080}
tonalli.mail.remitente=${MAIL_FROM:no-reply@tonalli.local}
tonalli.admin.correo=${TONALLI_ADMIN_CORREO:}
tonalli.admin.password=${TONALLI_ADMIN_PASSWORD:}
# Datos de ejemplo (usuarios, ofertas, votos y comentarios). Apagado por defecto: NUNCA activar en producción.
tonalli.demo.activo=${TONALLI_DEMO:false}
# Contraseña común de los usuarios de ejemplo (12 a 64 caracteres). Vacía: se crean con una clave al azar
# que nadie conoce, así que aparecen como autores pero no se puede entrar con ellos.
tonalli.demo.password=${TONALLI_DEMO_PASSWORD:}
# El correo SMTP se activa definiendo SPRING_MAIL_HOST (y SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD).
