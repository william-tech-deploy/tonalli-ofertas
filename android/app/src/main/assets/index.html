<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14213D">

<style>
html{color-scheme:light}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

<title>Tonalli</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='64 64 384 440'%3E%3Crect x='212' y='140' width='88' height='250' rx='44' fill='%23F5A524'/%3E%3Ccircle cx='256' cy='392' r='74' fill='%23E8501F'/%3E%3Crect x='88' y='96' width='336' height='88' rx='44' fill='%2314213D'/%3E%3C/svg%3E">
<style>
/* Layout: phone-width column (centered on wide screens): top band, scrolling main, bottom tab bar.
   Marca Tonalli: papel cálido + tinta, un solo color de acción (naranja quemado). Cada estado de temperatura
   (caliente, tibia, fría) lleva palabra e icono además de color. Tokens del kit de marca (tonalli-tokens.json). */
:root{
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --mono:var(--body);
  --bg:#FFF8EF; --desk:#F3E8D8; --surface:#FFFFFF; --surface-2:#F3E8D8;
  --fg:#14213D; --muted:#4A5877; --line:#E6D8C3;
  --accent:#C73E14; --accent-ink:#FFFFFF;
  --hot:#9A2F0C; --warm:#7A4A00; --cold:#0A5562;
  --hot-bg:#FFE3D8; --warm-bg:#FFEFC7; --cold-bg:#D9F0F3;
  --g-hot:#E8501F; --g-warm:#F5A524; --g-cold:#1AA6B7;
  --good:#1B7F47; --bad:#B3261E; --warn:#7A4A00; --on-good:#FFFFFF; --on-bad:#FFFFFF;
  --c-super:#2A8F61; --c-tech:#2A74CC; --c-ropa:#B93A77;
  --c-x1:#B87413; --c-x2:#0E8497; --c-x3:#7656BE; --c-x4:#80652F;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --desk:#070C16; --surface:#14213D; --surface-2:#1D2D52;
  --fg:#FFF8EF; --muted:#B8C2D9; --line:#2C3E66;
  --accent:#FF7A4D; --accent-ink:#14213D;
  --hot:#FFB59B; --warm:#FFD27A; --cold:#8FE0EE;
  --hot-bg:#4A1E10; --warm-bg:#3F2D08; --cold-bg:#0E3A44;
  --good:#46C27A; --bad:#FFB4AB; --warn:#FFD27A; --on-good:#04120A; --on-bad:#4A0B07;
  --c-super:#4FC48D; --c-tech:#5AA2F0; --c-ropa:#E56FA6;
  --c-x1:#F0A94A; --c-x2:#4FC0D3; --c-x3:#A58BE8; --c-x4:#C3A16A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --desk:#070C16; --surface:#14213D; --surface-2:#1D2D52;
  --fg:#FFF8EF; --muted:#B8C2D9; --line:#2C3E66;
  --accent:#FF7A4D; --accent-ink:#14213D;
  --hot:#FFB59B; --warm:#FFD27A; --cold:#8FE0EE;
  --hot-bg:#4A1E10; --warm-bg:#3F2D08; --cold-bg:#0E3A44;
  --good:#46C27A; --bad:#FFB4AB; --warn:#FFD27A; --on-good:#04120A; --on-bad:#4A0B07;
  --c-super:#4FC48D; --c-tech:#5AA2F0; --c-ropa:#E56FA6;
  --c-x1:#F0A94A; --c-x2:#4FC0D3; --c-x3:#A58BE8; --c-x4:#C3A16A;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--fg);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sp{flex:1}
.ic{flex:none;display:block}

#app{height:100%;max-width:480px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:520px){#app{border-inline:1px solid var(--line)}}
#screen{height:100%;display:flex;flex-direction:column}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:24px}

/* top band */
.top{background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.top-in{display:flex;align-items:center;gap:8px;min-height:54px}
.brand{font:800 24px/1 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand .logo{flex:none;display:block}
.ttl{font:700 19px/1.2 var(--display);letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icbtn{appearance:none;border:0;background:transparent;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--fg)}
.icbtn:hover{background:var(--surface-2)}
.badge{position:absolute;top:5px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:700 11px/18px var(--mono);text-align:center;padding:0 4px}
.ctabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.ctabs::-webkit-scrollbar{display:none}
.ctab{flex:none;appearance:none;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:7px;font:600 14px var(--body);padding:10px 10px 11px;border-bottom:3px solid transparent;cursor:pointer;min-height:44px}
.ctab[aria-current=true]{color:var(--fg);border-bottom-color:var(--accent)}
.ctab.add{padding-inline:8px}

/* bottom tab bar */
.bar{background:var(--surface);border-top:1px solid var(--line);flex:none}
.bar-in{display:grid;grid-template-columns:repeat(5,1fr)}
.tbtn{appearance:none;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 11px var(--body);cursor:pointer;min-height:58px;padding:6px 0}
.tbtn[aria-current=page]{color:var(--accent)}
.tbtn.post .ic{background:var(--accent);color:var(--accent-ink);border-radius:50%;padding:6px;width:32px;height:32px}

/* generic */
.pad{padding-block:16px}
.stack{display:grid;gap:16px;grid-auto-rows:max-content;align-content:start}
.lab{font:600 12px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{color:var(--muted);font-size:13px}
.err{color:var(--bad);font-size:13px;min-height:0}
.err:empty{display:none}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--body);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
:is(button,a,input,textarea,select):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:8px 10px;border-radius:8px;min-height:38px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.toolbar{padding-block:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--body);letter-spacing:.02em;padding:4px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.v-real{color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.v-fake{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.v-mild{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.v-none{color:var(--muted)}

/* fields */
.field{display:grid;gap:6px}
.field label,.field .lab{font:600 12px/1.2 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;min-height:46px}
textarea.inp{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font:600 14px var(--body);letter-spacing:0;text-transform:none;color:var(--fg);cursor:pointer;min-height:44px}
.chips input:checked+label{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--fg)}
.chips input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}

/* offer rows */
.list{background:var(--surface);border-block:1px solid var(--line)}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;appearance:none;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;padding-block:12px;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.thumb{width:64px;height:64px;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.thumb img{width:100%;height:100%;object-fit:cover}
.rb{display:grid;gap:3px;min-width:0}
.rt{font:600 15px/1.25 var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr b{font:700 17px var(--mono)}
.pr s{font:500 12px var(--mono);color:var(--muted)}
.pct{font:700 12px var(--mono);color:var(--good)}
.temp{display:grid;justify-items:center;gap:2px;min-width:52px}
.temp b{font:700 14px var(--mono)}
.t-hot{color:var(--hot)}.t-warm{color:var(--warm)}.t-cold{color:var(--cold)}
.tw{font:600 12px/1 var(--body);letter-spacing:.01em}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}

/* detail */
.hero{aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.hero img{width:100%;height:100%;object-fit:cover}
.dt{font:700 24px/1.15 var(--display);letter-spacing:-.015em;text-wrap:balance}
.bigp{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.bigp b{font:700 34px var(--mono);letter-spacing:-.02em}
.bigp s{font:500 16px var(--mono);color:var(--muted)}
.vbox{display:grid;gap:8px;justify-items:start}
.vbox p{color:var(--fg);font-size:14px}
.gauge{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--g-cold),var(--g-warm) 55%,var(--g-hot));position:relative;margin:10px 0 4px}
.gauge i{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--fg);transform:translateX(-50%)}
.gnum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gnum b{font:700 30px var(--mono)}
.votes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vb{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:56px;font:700 15px var(--body);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.vb.pos{color:var(--good)}.vb.neg{color:var(--bad)}
.vb.pos[aria-pressed=true]{background:var(--good);border-color:var(--good);color:var(--on-good)}
.vb.neg[aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.cmt{display:grid;gap:2px;padding:11px 0;border-bottom:1px solid var(--line)}
.cmt:last-of-type{border-bottom:0}
.cmt .who{font:600 13px var(--body)}
.cmt .who span{font-weight:400;color:var(--muted);margin-left:6px}
.sendrow{display:flex;gap:8px;align-items:flex-end}
.sendrow textarea{min-height:46px;height:46px}

/* chart */
.chartwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px 4px}
.chartwrap svg{display:block;width:100%;min-width:300px;height:auto}
.ch-t{fill:var(--muted);font:11px var(--mono)}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-line{stroke:var(--fg);stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--fg);opacity:.07}
.ch-base{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:6 4}
.ch-decl{stroke:var(--bad);stroke-width:1.6;stroke-dasharray:2 4;stroke-linecap:round}
.ch-pt{fill:var(--surface);stroke:var(--fg);stroke-width:1.8}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:0;border-top:2px solid}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:4px;min-width:0}
.stats b{font:700 16px var(--mono)}

/* proposals / progress */
.prog{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.prop{display:grid;gap:10px;padding-block:14px;border-bottom:1px solid var(--line)}
.prop:last-child{border-bottom:0}
.prop h3{font:700 17px var(--display)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* profile */
.hello{font:700 26px/1.1 var(--display);letter-spacing:-.02em}
.kbig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kbig b{font:700 44px/1 var(--mono);letter-spacing:-.03em}
.menu{background:var(--surface);border-block:1px solid var(--line)}
.mi{display:flex;align-items:center;gap:12px;width:100%;appearance:none;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding-block:14px;font:600 15px var(--body);cursor:pointer;min-height:52px}
.mi:last-child{border-bottom:0}
.mi .ic:first-child{color:var(--accent)}
.logrow{display:flex;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--line);font-size:14px}
.logrow:last-child{border-bottom:0}
.logrow b{font:700 14px var(--mono);color:var(--good)}

/* toggle */
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:14px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.alrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.alrow:last-child{border-bottom:0}
.alrow h3{font:600 16px var(--body)}

/* notifications */
.nrow{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:0}
.nrow.un{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.nic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--accent)}

#toast{position:absolute;left:50%;bottom:78px;transform:translate(-50%,10px);max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:10px;font:600 14px var(--body);opacity:0;pointer-events:none;z-index:5;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s,transform .2s}}
</style>
</head>
<body>
<div id="app"><div id="screen"></div><div id="toast" role="status" aria-live="polite"></div></div>

<script>
/* ================= LÓGICA PURA (sin DOM; se puede probar aparte) ================= */
// <logic>
function median(a){const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}
/* Veredicto de una rebaja: compara el precio de hoy con el precio habitual (mediana de lo registrado
   hace más de 10 días) y revisa si el "antes" anunciado aparece en ese historial. */
function priceVerdict(history,declaredOld,now){
  const prior=history.filter(h=>h.d>10).map(h=>h.p);
  if(history.length<5||prior.length<3)return{k:'none'};
  const base=median(prior),maxPrior=Math.max(...prior);
  const real=(base-now)/base,declared=(declaredOld-now)/declaredOld;
  const inflated=declaredOld>maxPrior*1.03;
  if(inflated||(real<0.02&&declared>=0.1))return{k:'fake',base,real,declared,inflated};
  if(real>=0.08)return{k:'real',base,real,declared};
  return{k:'mild',base,real,declared};
}
const SHORTENERS=['bit.ly','tinyurl.com','t.co','goo.gl','is.gd','cutt.ly','ow.ly','rebrand.ly','shorturl.at'];
function analyzeUrl(raw){
  raw=String(raw||'').trim();
  if(raw&&!/^[a-z][a-z0-9+.-]*:\/\//i.test(raw))raw='https://'+raw;
  let u;try{u=new URL(raw)}catch(e){return{ok:false,flags:['invalid']}}
  const f=[],h=u.hostname.toLowerCase();
  if(u.protocol!=='https:')f.push('http');
  if(u.username||u.password)f.push('creds');
  if(/^\d{1,3}(\.\d{1,3}){3}$/.test(h))f.push('ip');
  if(h.split('.').some(p=>p.startsWith('xn--')))f.push('punycode');
  if(SHORTENERS.includes(h))f.push('short');
  if(/\.(zip|mov|xyz|top|click|gq|tk|ml|cf)$/.test(h))f.push('tld');
  return{ok:f.length===0,flags:f,url:u.href};
}
function eanCheck(d12){let s=0;for(let i=0;i<12;i++)s+=(+d12[i])*(i%2?3:1);return(10-s%10)%10}
function isValidEAN(c){
  c=String(c).replace(/\D/g,'');
  if(c.length===13)return eanCheck(c.slice(0,12))===+c[12];
  if(c.length===12)return isValidEAN('0'+c);
  if(c.length===8){let s=0;for(let i=0;i<7;i++)s+=(+c[i])*(i%2?1:3);return(10-s%10)%10===+c[7]}
  return false;
}
const toEAN13=c=>{c=String(c).replace(/\D/g,'');return c.length===12?'0'+c:c};
const LV=[0,50,150,400]; // Chispa, Brasa, Fogata, Hoguera (los umbrales los define el producto)
const levelOf=k=>LV.reduce((a,v,i)=>k>=v?i:a,0);
const GOAL=500,AUTOHIDE=3,PROPOSE_LVL=2;
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const matchAlert=(a,o)=>a.on&&!o.hidden&&norm(o.title).includes(norm(a.kw))&&o.now<=a.max;
const temp=o=>o.temp!==undefined?o.temp:o.up-o.down;
const heat=t=>t>=100?'hot':t>=0?'warm':'cold'; // caliente, tibia, fría
// </logic>

/* ================= TEXTOS (i18n) ================= */
const TX={
es:{
'nav.home':'Inicio','nav.scan':'Escáner','nav.post':'Publicar','nav.alerts':'Alertas','nav.me':'Perfil',
'back':'Atrás','sample':'Datos de ejemplo para el prototipo.','hello':'Hola',
'cat.super':'Supermercado','cat.tech':'Tecnología','cat.ropa':'Ropa',

/* ================= CONEXIÓN CON EL SERVIDOR (API) =================
   Si la dirección de la API está vacía, la app corre en MODO DEMOSTRACIÓN (datos locales, sin cuentas).
   Si tiene dirección, corre en MODO SERVIDOR: cuentas, ofertas, votos, comentarios y alertas viven en el servidor.
   Dirección: <meta name="tonalli-api" content="https://api.tu-dominio.com"> (o window.TONALLI_API antes de este script). */
const API_RAW=String(window.TONALLI_API||((document.querySelector('meta[name="tonalli-api"]')||{}).content)||'').trim().replace(/\/+$/,'');
/* Solo HTTPS (o localhost para desarrollo): jamás se envían contraseñas ni tokens por HTTP a un servidor remoto. */
const API=/^https:\/\/[^\s/]+$/i.test(API_RAW)||/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(API_RAW)?API_RAW:'';
if(API_RAW&&!API)console.warn('Tonalli: la dirección de la API debe ser HTTPS. Se usa el modo demostración.');
const SRV=!!API;
const RTK='tonalli.rt';
/* Token de acceso solo en memoria; el de renovación en localStorage (en la app Android el WebView es privado a la app). */
const A={at:null,rt:(()=>{try{return localStorage.getItem(RTK)}catch(e){return null}})(),flight:null};
function setTokens(j){A.at=j.access_token;A.rt=j.refresh_token;try{localStorage.setItem(RTK,A.rt)}catch(e){}}
function clearTokens(){A.at=A.rt=null;try{localStorage.removeItem(RTK)}catch(e){}}
/* Renovar la sesión: una sola petición a la vez (el token de renovación es de un solo uso y rota en cada uso). */
function refreshTok(){
  if(!A.rt)return Promise.reject({status:401,code:'session'});
  if(!A.flight){
    const once=()=>fetch(API+'/v1/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:A.rt}),cache:'no-store',credentials:'omit'});
    A.flight=(async()=>{
      let r;try{r=await once()}catch(e){throw{status:0,code:'network'}}
      let j=null;try{j=await r.json()}catch(e){}
      if(r.status===401&&j&&j.error&&j.error.code==='refresh_retry'){await new Promise(z=>setTimeout(z,800));try{r=await once();j=await r.json()}catch(e){throw{status:0,code:'network'}}}
      if(!r.ok)throw{status:r.status,code:(j&&j.error&&j.error.code)||'session'};
      setTokens(j);
    })().finally(()=>{A.flight=null});
  }
  return A.flight;
}
async function api(method,path,body,o={}){
  const go=()=>fetch(API+'/v1'+path,{method,headers:{...(body!==undefined?{'Content-Type':'application/json'}:{}),...(A.at&&!o.anon?{Authorization:'Bearer '+A.at}:{})},body:body!==undefined?JSON.stringify(body):undefined,cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});
  let r;try{r=await go()}catch(e){throw{status:0,code:'network'}}
  if(r.status===401&&!o.anon&&A.rt){
    try{await refreshTok()}catch(e){if(e.status!==0)await dropSession();throw e.status===0?e:{status:401,code:'session'}}
    try{r=await go()}catch(e){throw{status:0,code:'network'}}
  }
  if(r.status===204)return null;
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const er=(j&&j.error)||{};throw{status:r.status,code:er.code||'error',retry:+r.headers.get('Retry-After')||0}}
  return j;
}
/* Foto: requiere sesión, así que se pide con fetch y se muestra como objeto local (blob). */
async function apiBlob(path){
  const go=()=>fetch(API+'/v1'+path,{headers:{Authorization:'Bearer '+A.at},cache:'no-store',credentials:'omit'});
  let r=await go();
  if(r.status===401&&A.rt){await refreshTok();r=await go()}
  if(!r.ok)throw{status:r.status};
  return URL.createObjectURL(await r.blob());
}

function chartSvg(o){
  const hs=o.history,v=verdictOf(o);
  const W=360,Hh=236,L=48,Rr=16,T=16,B=32;
  const prices=hs.map(h=>h.p).concat([o.old]);if(v.base)prices.push(v.base);
  let lo=Math.min(...prices),hi=Math.max(...prices);const pad=(hi-lo)*.12||hi*.1||1;lo=Math.max(0,lo-pad);hi+=pad;
  const X=d=>L+(1-d/49)*(W-L-Rr),Y=p=>T+(1-(p-lo)/(hi-lo))*(Hh-T-B);
  const ticks=[0,1,2,3].map(i=>lo+(hi-lo)*i/3);
  const grid=ticks.map(p=>`<line class="ch-grid" x1="${L}" x2="${W-Rr}" y1="${Y(p).toFixed(1)}" y2="${Y(p).toFixed(1)}"/><text class="ch-t" x="${L-6}" y="${(Y(p)+4).toFixed(1)}" text-anchor="end">${p>=100?p.toFixed(0):p.toFixed(2)}</text>`).join('');
  const xl=[[49,'start'],[28,'middle'],[14,'middle'],[0,'end']].map(([d,a])=>`<text class="ch-t" x="${X(d).toFixed(1)}" y="${Hh-10}" text-anchor="${a}">${d===0?t('ch.now'):t('ch.week',{n:d/7})}</text>`).join('');
  const pts=hs.map(h=>`${X(h.d).toFixed(1)} ${Y(h.p).toFixed(1)}`);
  const line='M'+pts.join(' L'),area=`${line} L${X(0).toFixed(1)} ${Y(lo).toFixed(1)} L${X(49).toFixed(1)} ${Y(lo).toFixed(1)}Z`;
  const dots=hs.map((h,i)=>i===hs.length-1?`<circle cx="${X(h.d).toFixed(1)}" cy="${Y(h.p).toFixed(1)}" r="5.5" style="fill:var(--${v.k==='real'?'good':v.k==='fake'?'bad':'warn'});stroke:var(--surface);stroke-width:2"/>`:`<circle class="ch-pt" cx="${X(h.d).toFixed(1)}" cy="${Y(h.p).toFixed(1)}" r="3"/>`).join('');
  const lab=`${t('ch.title')}: ${o.title}`;
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(lab)}"><title>${esc(lab)}</title>${grid}${xl}<path class="ch-area" d="${area}"/><line class="ch-decl" x1="${L}" x2="${W-Rr}" y1="${Y(o.old).toFixed(1)}" y2="${Y(o.old).toFixed(1)}"/>${v.base?`<line class="ch-base" x1="${L}" x2="${W-Rr}" y1="${Y(v.base).toFixed(1)}" y2="${Y(v.base).toFixed(1)}"/>`:''}<path class="ch-line" d="${line}"/>${dots}</svg>`;
}

  tab:el=>tab(el.dataset.t),
  back:()=>back(),
  open:el=>go('detail',el.dataset.id),
  goNotif:()=>go('notif'),goCats:()=>go('cats'),goMod:()=>{UI.modOffer=null;go('mod')},
  cat:el=>{UI.cat=el.dataset.id;render()},
  sort:el=>{UI.sort=el.dataset.s;render()},
  chart:()=>go('chart',R.id),
  report:()=>{UI.modOffer=R.id;go('mod')},
  role:el=>{S.role=el.dataset.r;save();render()},
  lang:el=>{S.lang=el.dataset.l;save();render()},
  readAll:()=>{S.notifs.forEach(n=>n.read=true);save();render()},
  reset:()=>{if(!UI.resetArm){UI.resetArm=true;render();setTimeout(()=>{UI.resetArm=false},4000);return}
    UI.resetArm=false;try{localStorage.removeItem(KEY)}catch(e){};const lang=S.lang;S=seed();S.lang=lang;UI.cat='super';UI.scan=null;UI.photo=null;save();tab('home');toast(t('nt.done'))},
  vote:el=>{
    const o=byId(R.id),val=+el.dataset.v,prev=S.user.voted[o.id]||0;
    if(prev===val){val===1?o.up--:o.down--;delete S.user.voted[o.id]}
    else{if(prev===1)o.up--;if(prev===-1)o.down--;val===1?o.up++:o.down++;S.user.voted[o.id]=val;if(!prev)addKarma('k.vote',1,20)}
    save();render();
  },
  pvote:el=>{
    const p=S.proposals.find(x=>x.id===el.dataset.id);if(!p||p.created||S.user.catVotes[p.id])return;

const CHG={
  alertOn:el=>{const a=S.alerts.find(x=>x.id===el.dataset.id);if(a){a.on=el.checked;save();render()}},
  push:el=>{S.push=el.checked;save()},
  photo:async el=>{
    const f=el.files&&el.files[0];if(!f)return;

    try{const bmp=await createImageBitmap(f),det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}),r=await det.detect(bmp);
      if(r.length)doScan(r[0].rawValue);else toast(t('sc.noread'))}
    catch(e){toast(t('sc.noread'))}

function setErr(f,m){const e=f&&f.querySelector('.err');if(e)e.textContent=m}
function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.src=fr.result};fr.readAsDataURL(file)})}

function doScan(raw){
  raw=String(raw||'').trim();const digits=raw.replace(/\D/g,'');
  if(digits&&digits===raw.replace(/\s/g,'')&&digits.length>=8){
    const valid=isValidEAN(digits),e=toEAN13(digits);
    UI.scan={q:digits,mode:'code',valid,list:valid?S.offers.filter(o=>o.ean===e&&!o.hidden).sort((a,b)=>a.now-b.now):[]};
  }else{
    const q=norm(raw);
    UI.scan={q:raw,mode:'text',list:q?S.offers.filter(o=>!o.hidden&&(norm(o.title).includes(q)||norm(o.store).includes(q))).sort((a,b)=>temp(b)-temp(a)):[]};
  }
  render();
}

const SUB={
  scan:f=>doScan(f.elements.q.value),
  comment:f=>{
    const v=f.elements.txt.value.trim();if(!v)return;const o=byId(R.id);
    o.comments.push({a:'me',txt:v.slice(0,300),ts:Date.now(),me:true});addKarma('k.comment',2,10);save();render();
    const m=document.querySelector('main');if(m)m.scrollTop=m.scrollHeight;
  },
  pub:f=>{
    const g=n=>f.elements[n].value.trim(),num=s=>parseFloat(String(s).replace(',','.'));
    const cat=f.elements.cat.value,title=g('title'),store=g('store'),old=num(g('old')),now=num(g('now')),url=g('url'),ean=g('ean').replace(/\D/g,'');
    if(!cat||!title||!store||!(old>0)||!(now>0))return setErr(f,t('pub.e.fields'));
    if(now>=old)return setErr(f,t('pub.e.price'));
    if(!UI.photo&&!url)return setErr(f,t('pub.e.evid'));
    let safe=null;if(url){safe=analyzeUrl(url);if(!safe.ok)return setErr(f,t('pub.e.url',{why:urlWhy(safe.flags)}))}
    if(ean&&!isValidEAN(ean))return setErr(f,t('pub.e.ean'));
    const o={id:'u'+uid(),cat,title,store,now,old,ean:ean?toEAN13(ean):null,url:safe?safe.url:null,photo:UI.photo,author:'me',ts:Date.now(),up:0,down:0,reports:0,comments:[],history:[{d:0,p:now}]};
    S.offers.unshift(o);const pts=addKarma('k.publish',15);checkAlertsFor(o);
    UI.cat=cat;UI.photo=null;UI.draft=null;save();
    R.tab='home';R.name='home';R.stack=[];go('detail',o.id);toast(t('pub.ok',{n:pts}));
  },
  propose:f=>{
    const name=f.elements.name.value.trim(),why=f.elements.why.value.trim();
    if(name.length<3)return setErr(f,t('ct.name.e'));
    const dup=[...S.cats.filter(c=>!c.base).map(c=>c.name),...S.cats.filter(c=>c.base).map(c=>t('cat.'+c.id)),...S.proposals.map(p=>p.name)].some(n=>norm(n)===norm(name));
    if(dup)return setErr(f,t('ct.dup'));
    const p={id:'p'+uid(),name,why:why||'—',by:'me',votes:1,created:false};
    S.proposals.unshift(p);S.user.catVotes[p.id]=1;addKarma('k.propose',5);save();render();toast(t('ct.sent'));
  },
  alert:f=>{
    const kw=f.elements.kw.value.trim(),max=parseFloat(String(f.elements.max.value).replace(',','.'));
    if(!kw||!(max>0))return setErr(f,t('al.err'));
    S.alerts.unshift({id:'a'+uid(),kw,max,on:true,seen:[]});save();render();
  },
  report:f=>{
    const id=f.elements.offer.value,reason=f.elements.reason.value,o=byId(id);
    if(!o)return setErr(f,t('md.pick'));
    S.reports.unshift({id:uid(),offer:id,reason,detail:f.elements.detail.value.trim().slice(0,200),ts:Date.now()});
    o.reports=(o.reports||0)+1;
    if(o.reports>=AUTOHIDE&&!o.hidden){o.hidden=true;pushNotif('n.hide',{title:o.title})}
    UI.modOffer=null;save();render();toast(t('md.sent'));
  },
  link:f=>{const raw=f.elements.u.value.trim();if(!raw){UI.link=null;return render()}const a=analyzeUrl(raw);UI.link={raw,ok:a.ok,flags:a.flags};render()}
};

/* ================= MODO SERVIDOR: acciones que van a la API ================= */
function vAuth(){
  const m=UI.auth||'login';
  const msg=UI.msg?`<div class="box v-real" style="font-weight:600" role="status">${esc(UI.msg)}</div>`:'';
  const em=`<div class="field"><label for="au-e">${t('au.email')}</label><input id="au-e" name="email" type="email" class="inp" autocomplete="email" inputmode="email" maxlength="254"></div>`;
  const pw=(id,ac,lb)=>`<div class="field"><label for="${id}">${lb||t('au.pass')}</label><input id="${id}" name="password" type="password" class="inp" autocomplete="${ac}" maxlength="128"></div>`;
  const lnk=(mode,txt)=>`<button type="button" class="btn block" data-a="authMode" data-m="${mode}">${txt}</button>`;
  let body='';
  if(m==='login')body=`<form data-s="login" class="stack" novalidate>${em}${pw('au-p','current-password')}<p class="err" role="alert"></p><button class="btn primary block">${t('au.login')}</button></form>${lnk('register',t('au.new'))}${lnk('forgot',t('au.forgot'))}`;
  else if(m==='register')body=`<form data-s="register" class="stack" novalidate>${em}<div class="field"><label for="au-h">${t('au.handle')}</label><input id="au-h" name="handle" class="inp" autocomplete="username" maxlength="20" autocapitalize="none"><p class="note">${t('au.handle.h')}</p></div>${pw('au-p','new-password')}<p class="note">${t('au.pass.h')}</p><p class="err" role="alert"></p><button class="btn primary block">${t('au.register')}</button></form>${lnk('login',t('au.have'))}`;
  else if(m==='forgot')body=`<form data-s="forgot" class="stack" novalidate>${em}<p class="err" role="alert"></p><button class="btn primary block">${t('au.send')}</button></form>${lnk('login',t('au.back'))}`;
  else if(m==='reset')body=`<form data-s="reset" class="stack" novalidate><h2 class="lab">${t('au.reset.t')}</h2>${pw('au-p','new-password',t('au.pass.new'))}<p class="note">${t('au.pass.h')}</p><p class="err" role="alert"></p><button class="btn primary block">${t('au.reset.go')}</button></form>`;
  return `<main class="gut pad stack" style="max-width:480px;margin-inline:auto"><div class="stack" style="gap:6px;padding-top:24px"><h1 class="brand" style="font-size:28px">${logo(44)}Tonalli</h1><p class="note">${t('au.tag')}</p></div>${msg}${body}</main>`;
}
function srvBanner(){
  if(!S.me)return '';
  return S.me.email_verified?'':`<div class="box v-mild gut stack" style="margin:12px 16px;gap:8px"><p style="font-weight:600">${t('au.unverified')}</p><button class="btn" data-a="resend" style="min-height:40px">${t('au.resend')}</button></div>`;
}
async function doScanSrv(raw){
  raw=String(raw||'').trim();const digits=raw.replace(/\D/g,'');
  try{
    if(digits&&digits===raw.replace(/\s/g,'')&&digits.length>=8){
      const valid=isValidEAN(digits);let list=[];
      if(valid)list=(await api('GET','/products/'+toEAN13(digits))).items.map(upsert).filter(o=>!o.hidden).sort((a,b)=>a.now-b.now);
      UI.scan={q:digits,mode:'code',valid,list};
    }else{
      let list=[];if(norm(raw).length>=2)list=(await api('GET','/offers?q='+encodeURIComponent(raw.slice(0,60))+'&limit=30')).items.map(upsert).sort((a,b)=>temp(b)-temp(a));
      UI.scan={q:raw,mode:'text',list};
    }
    render();
  }catch(e){fail(e)}
}
if(SRV){
  const SA={
    open:el=>{go('detail',el.dataset.id);loadDetail(el.dataset.id)},
    chart:()=>{go('chart',R.id)},
    tab:el=>{tab(el.dataset.t);if(el.dataset.t==='home')loadOffers().then(()=>render()).catch(()=>{})},
    resend:async()=>{try{await api('POST','/auth/resend-verification');toast(t('au.sent'))}catch(e){fail(e)}},
    authMode:el=>{UI.auth=el.dataset.m;UI.msg='';render(true)},
    logout:async()=>{try{await api('POST','/auth/logout')}catch(e){}await dropSession()},
    role:async el=>{try{applyMe(await api('PATCH','/me',{mode:el.dataset.r}));render()}catch(e){fail(e)}},
    lang:async el=>{S.lang=el.dataset.l;save();render();try{applyMe(await api('PATCH','/me',{lang:S.lang}));render()}catch(e){}},
    readAll:async()=>{try{await api('POST','/notifications/read');await loadNotifs();render()}catch(e){fail(e)}},
    vote:async el=>{
      const o=byId(R.id),val=+el.dataset.v,send=(S.user.voted[o.id]||0)===val?0:val;
      try{mapOffer(await api('PUT','/offers/'+o.id+'/vote',{value:send}),o);refreshMe();render()}catch(e){fail(e)}
    },
    pvote:async el=>{
      try{await api('PUT','/category-proposals/'+el.dataset.id+'/vote');await Promise.all([loadProps(),loadCats(),refreshMe(),loadNotifs()]);render()}catch(e){fail(e)}
    },
    delAlert:async el=>{try{await api('DELETE','/alerts/'+el.dataset.id);await loadAlerts();render()}catch(e){fail(e)}},
    testAlerts:async()=>{try{const r=await api('POST','/alerts/check');await loadNotifs();render();toast(r.new_notifications?t('al.tested',{n:r.new_notifications}):t('al.none2'))}catch(e){fail(e)}},
    reset:()=>SA.logout()
  };
  const SC={
    alertOn:async el=>{try{await api('PATCH','/alerts/'+el.dataset.id,{active:el.checked});await loadAlerts()}catch(e){fail(e)}render()}
  };
  const SS={
    scan:f=>doScanSrv(f.elements.q.value),
    login:async f=>{
      const email=f.elements.email.value.trim(),password=f.elements.password.value;
      if(!email||!password)return setErr(f,t('au.err.fields'));
      busy(f,true);
      try{
        setTokens(await api('POST','/auth/login',{email,password,device_name:'Tonalli '+(window.TonalliNative?'Android':'Web')},{anon:true}));
        await hydrate();UI.msg='';R.name='home';R.tab='home';R.stack=[];render(true);
      }catch(e){clearTokens();S.me=null;busy(f,false);fail(e,f)}
    },
    register:async f=>{
      const email=f.elements.email.value.trim(),handle=f.elements.handle.value.trim(),password=f.elements.password.value;
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return setErr(f,t('au.err.email'));
      if(!/^[A-Za-z0-9_.]{3,20}$/.test(handle))return setErr(f,t('au.err.handle'));
      if([...password].length<15)return setErr(f,t('au.err.pass'));
      busy(f,true);
      try{await api('POST','/auth/register',{email,handle,password,lang:S.lang},{anon:true});UI.auth='login';UI.msg=t('au.reg.ok');render(true)}
      catch(e){busy(f,false);fail(e,f)}
    },
    forgot:async f=>{
      const email=f.elements.email.value.trim();if(!email)return setErr(f,t('au.err.email'));
      busy(f,true);
      try{await api('POST','/auth/forgot-password',{email},{anon:true});UI.auth='login';UI.msg=t('au.sent');render(true)}
      catch(e){busy(f,false);fail(e,f)}
    },
    reset:async f=>{
      const password=f.elements.password.value;if([...password].length<15)return setErr(f,t('au.err.pass'));
      busy(f,true);
      try{await api('POST','/auth/reset-password',{token:UI.token,new_password:password},{anon:true});UI.token=null;UI.auth='login';UI.msg=t('au.reset.ok');render(true)}
      catch(e){busy(f,false);fail(e,f)}
    },
    comment:async f=>{
      const v=f.elements.txt.value.trim();if(!v)return;const o=byId(R.id);busy(f,true);
      try{const c=await api('POST','/offers/'+o.id+'/comments',{body:v.slice(0,300)});o.comments.push({a:c.author,txt:c.body,ts:Date.parse(c.created_at),me:true});refreshMe();render();const m=document.querySelector('main');if(m)m.scrollTop=m.scrollHeight}
      catch(e){busy(f,false);fail(e)}
    },
    pub:async f=>{
      const g=n=>f.elements[n].value.trim(),num=s=>parseFloat(String(s).replace(',','.'));
      const cat=f.elements.cat.value,title=g('title'),store=g('store'),old=num(g('old')),now=num(g('now')),url=g('url'),ean=g('ean').replace(/\D/g,'');
      if(!cat||!title||!store||!(old>0)||!(now>0))return setErr(f,t('pub.e.fields'));
      if(now>=old)return setErr(f,t('pub.e.price'));
      if(!UI.photo&&!url)return setErr(f,t('pub.e.evid'));
      let safe=null;if(url){safe=analyzeUrl(url);if(!safe.ok)return setErr(f,t('pub.e.url',{why:urlWhy(safe.flags)}))}
      if(ean&&!isValidEAN(ean))return setErr(f,t('pub.e.ean'));
      const body={category_id:cat,title,store,price_old_cents:Math.round(old*100),price_now_cents:Math.round(now*100)};
      if(ean)body.ean=toEAN13(ean);if(safe)body.link_url=safe.url;
      if(UI.photo)body.photo=UI.photo.replace(/^data:image\/jpeg;base64,/,'');
      busy(f,true);
      try{
        const o=upsert(await api('POST','/offers',body));if(UI.photo)o.photo=UI.photo;
        UI.cat=cat;UI.photo=null;UI.draft=null;refreshMe();
        R.tab='home';R.name='home';R.stack=[];go('detail',o.id);loadDetail(o.id);toast(t('pub.ok',{n:15}));
      }catch(e){busy(f,false);fail(e,f)}
    },
    propose:async f=>{
      const name=f.elements.name.value.trim(),why=f.elements.why.value.trim();
      if(name.length<3)return setErr(f,t('ct.name.e'));
      busy(f,true);
      try{const body={name};if(why)body.why=why;await api('POST','/category-proposals',body);await Promise.all([loadProps(),refreshMe()]);render();toast(t('ct.sent'))}
      catch(e){busy(f,false);fail(e,f)}
    },
    alert:async f=>{
      const kw=f.elements.kw.value.trim(),max=parseFloat(String(f.elements.max.value).replace(',','.'));
      if(kw.length<2||!(max>0))return setErr(f,t('al.err'));
      busy(f,true);
      try{await api('POST','/alerts',{keyword:kw,max_price_cents:Math.round(max*100)});await loadAlerts();render()}
      catch(e){busy(f,false);fail(e,f)}
    },
    report:async f=>{
      const id=f.elements.offer.value,reason=f.elements.reason.value,o=byId(id);
      if(!o)return setErr(f,t('md.pick'));
      const detail=f.elements.detail.value.trim().slice(0,200),body={reason};if(detail)body.detail=detail;
      busy(f,true);
      try{await api('POST','/offers/'+id+'/reports',body);S.reports.unshift({id:uid(),offer:id,reason,ts:Date.now()});UI.modOffer=null;render();toast(t('md.sent'))}
      catch(e){busy(f,false);fail(e,f)}
    }
  };
  Object.assign(ACT,SA);Object.assign(CHG,SC);Object.assign(SUB,SS);
}
/* Arranque. En modo servidor: abre el enlace de confirmación/restablecimiento si viene en la dirección y recupera la sesión. */
async function boot(){
  if(!SRV){render(true);return}
  UI.auth='login';
  const m=location.hash.match(/^#\/(verify|reset)\/([\w-]{47})$/);
  if(m){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
  if(m&&m[1]==='verify'){try{await api('POST','/auth/verify-email',{token:m[2]},{anon:true});UI.msg=t('au.verified')}catch(e){UI.msg=errMsg(e)}}
  if(m&&m[1]==='reset'){UI.auth='reset';UI.token=m[2]}
  else if(A.rt){try{await refreshTok();await hydrate();R.name='home'}catch(e){if(e.status===0)UI.msg=t('e.net');else clearTokens();S.me=null}}
  render(true);
  /* mientras la app está abierta, se traen cada minuto las notificaciones y las ofertas nuevas */
  setInterval(async()=>{if(!S.me||document.hidden)return;try{await loadNotifs();if(R.name==='home'||R.name==='notif'||R.name==='alerts'){await loadOffers()}render()}catch(e){}},60000);
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&ACT[el.dataset.a])ACT[el.dataset.a](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&CHG[el.dataset.c])CHG[el.dataset.c](el,e)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-s]');if(f){e.preventDefault();SUB[f.dataset.s](f)}});

/* Ganchos para la app de Android (MainActivity.kt). En el navegador no se usan. */
window.onNativeBarcode=code=>{if(R.name!=='scan')tab('scan');doScan(code)};
window.onNativeScanError=()=>toast(t('sc.noread'));
window.nativeBack=function(){
  if(R.stack.length||R.name!==R.tab){back();return true}
  if(R.tab!=='home'){tab('home');return true}
  return false;
};

boot();
