# Producción en un VPS: Caddy (HTTPS automático) -> API (red interna, sin puertos públicos).
# Uso:  cp .env.example .env  (rellena los valores)  &&  docker compose up -d --build
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0              # solo alcanzable desde la red interna de Docker (Caddy)
      PORT: "3000"
      TRUST_PROXY_HOPS: "1"      # exactamente un proxy (Caddy) delante
      DATABASE_PATH: /app/data/tonalli.db
    volumes:
      - tonalli-data:/app/data
    read_only: true              # sistema de archivos de solo lectura salvo el volumen
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    networks: [internal]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN}
    depends_on: [api]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
volumes:
  tonalli-data:
  caddy-data:
  caddy-config:
networks:
  internal:
